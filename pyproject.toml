[project]
name = "bioview-server"
version = "0.9.7.3"
description = "Cross-platform backend providing core functionality for headless and networked clients"
authors = [
    {name = "Aakash Kapoor",email = "113218196+meowkash@users.noreply.github.com"}
]
license = {text = "GPL-v3"}
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "h5py (>=3.14.0,<4.0.0)",
    "numpy (>=1.26,<2)",
    "scipy (>=1.16.1,<1.18)",
    "wmi (>=1.5.1) ; platform_system == 'Windows'",
    "sounddevice (>=0.4.6,<0.6)"
]

[project.scripts]
bioview-server = "bioview_server.server:main"

[project.optional-dependencies]
uhd = [
    "uhd ; platform_system == 'Windows'"
]
biopac = [
    "wmi ; platform_system == 'Windows'"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
ruff = ">=0.12.8"
pytest = ">=8.4.1"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 89
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    ".venv"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90"]
ignore = [
    "E203",
    "C901"
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"bioview_server/device/usrp/backend.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["your_package"]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
